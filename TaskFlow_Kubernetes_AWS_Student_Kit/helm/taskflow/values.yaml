namespace: taskflow
postgres:
  image: {repository: postgres, tag: "16-alpine"}
  database: taskflow
  username: taskflow
  persistence: {size: 1Gi}
api:
  replicaCount: 2
  image: {repository: taskflow-api, tag: "1.0", pullPolicy: IfNotPresent}
  service: {port: 8000}
frontend:
  replicaCount: 2
  image: {repository: taskflow-frontend, tag: "1.0", pullPolicy: IfNotPresent}
  service: {type: NodePort, port: 80, nodePort: 30519}
database:
  password: "change-me"
ingress:
  enabled: false
  className: nginx
  host: taskflow.local
  tls: {enabled: false, secretName: taskflow-tls}
