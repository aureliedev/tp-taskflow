apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-pvc, namespace: {{ .Values.namespace }}}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.postgres.persistence.size }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: {{ .Values.namespace }}}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
        env:
        - {name: POSTGRES_DB, value: "{{ .Values.postgres.database }}"}
        - {name: POSTGRES_USER, value: "{{ .Values.postgres.username }}"}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: taskflow-db, key: POSTGRES_PASSWORD}}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: {{ .Values.namespace }}}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
