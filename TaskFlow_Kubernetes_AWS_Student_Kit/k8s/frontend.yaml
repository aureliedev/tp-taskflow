apiVersion: apps/v1
kind: Deployment
metadata: {name: taskflow-frontend, namespace: taskflow}
spec:
  replicas: 2
  selector: {matchLabels: {app: taskflow-frontend}}
  template:
    metadata: {labels: {app: taskflow-frontend}}
    spec:
      containers:
      - name: frontend
        image: taskflow-frontend:1.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: taskflow-frontend, namespace: taskflow}
spec:
  type: NodePort
  selector: {app: taskflow-frontend}
  ports: [{port: 80, targetPort: 80, nodePort: 30519}]
