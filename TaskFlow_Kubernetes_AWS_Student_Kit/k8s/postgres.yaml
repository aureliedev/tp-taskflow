apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-pvc, namespace: taskflow}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: taskflow}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - {name: POSTGRES_DB, value: taskflow}
        - {name: POSTGRES_USER, value: taskflow}
        - name: POSTGRES_PASSWORD
          valueFrom: {secretKeyRef: {name: taskflow-db, key: POSTGRES_PASSWORD}}
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-pvc}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: taskflow}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
