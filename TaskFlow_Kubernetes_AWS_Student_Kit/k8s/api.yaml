apiVersion: apps/v1
kind: Deployment
metadata: {name: taskflow-api, namespace: taskflow}
spec:
  replicas: 2
  selector: {matchLabels: {app: taskflow-api}}
  template:
    metadata: {labels: {app: taskflow-api}}
    spec:
      containers:
      - name: api
        image: taskflow-api:1.0
        imagePullPolicy: IfNotPresent
        env:
        - {name: DB_HOST, value: postgres}
        - {name: DB_PORT, value: "5432"}
        - {name: DB_NAME, value: taskflow}
        - {name: DB_USER, value: taskflow}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: taskflow-db, key: POSTGRES_PASSWORD}}
        ports: [{containerPort: 8000}]
        readinessProbe: {httpGet: {path: /api/health, port: 8000}}
---
apiVersion: v1
kind: Service
metadata: {name: taskflow-api, namespace: taskflow}
spec:
  selector: {app: taskflow-api}
  ports: [{port: 8000, targetPort: 8000}]
